<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>nn graph</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; display: flex; }

/* ── graph area ── */
#graph-area { flex: 1; position: relative; min-width: 0; }
svg { width: 100%; height: 100%; display: block; cursor: grab; }
svg:active { cursor: grabbing; }

/* ── tooltip ── */
#tooltip {
  position: absolute; pointer-events: none; z-index: 20;
  background: rgba(10,10,30,.92); border: 1px solid #3a4a6a;
  padding: 8px 12px; border-radius: 6px; font-size: 13px;
  max-width: 280px; line-height: 1.4; display: none;
}
#tooltip .tip-title { font-weight: 600; margin-bottom: 3px; }
#tooltip .tip-tags  { color: #7eb8f7; font-size: 11px; }
#tooltip .tip-type  { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
#tooltip .tip-body  { color: #bbb; font-size: 11px; margin: 3px 0; max-width: 320px; white-space: normal; }
#tooltip .tip-body:empty { display: none; }

/* ── zoom controls ── */
#zoom-controls {
  position: absolute; bottom: 18px; left: 18px; z-index: 10;
  display: flex; flex-direction: column; gap: 4px;
}
#zoom-controls button {
  width: 30px; height: 30px; background: #16213e; border: 1px solid #3a4a6a;
  color: #ccc; font-size: 16px; border-radius: 5px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; line-height: 1;
}
#zoom-controls button:hover { background: #2a3a5e; color: #fff; }

/* ── node type legend ── */
#legend {
  position: absolute; top: 14px; left: 14px; z-index: 10;
  background: rgba(10,10,30,.85); border: 1px solid #2a3a5e;
  border-radius: 6px; padding: 8px 12px; font-size: 11px;
}
#legend .leg-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
#legend .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#legend .leg-label { color: #aaa; }

/* ── per-axis micro-legends (shown only in focus mode) ── */
.mlegend {
  position: absolute; z-index: 10; display: none;
  color: #9fb0c8; font-size: 11px; max-width: 300px;
  background: rgba(10,10,30,.7); border-radius: 5px; padding: 3px 8px;
  pointer-events: none;
}
.mlegend.visible { display: block; }
.mlegend b { color: #cfe0f7; font-weight: 600; margin-right: 5px; }
.mlegend.mlegend-warn b { color: #f77e7e; }
#mlegend-top    { top: 84px;  left: 50%; transform: translateX(-50%); } /* below the breadcrumb, which also sits top-center */
#mlegend-bottom { bottom: 14px; left: 50%; transform: translateX(-50%); }
#mlegend-left   { left: 14px;  top: 50%; transform: translateY(-50%); max-width: 150px; }
#mlegend-right  { right: 14px; top: 50%; transform: translateY(-50%); max-width: 200px; text-align: right; }
/* Armed-state hint: centered banner shown when Zoned is on but unfocused. */
#zoned-hint {
  position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: none;
  background: rgba(28,43,74,.92); border: 1px solid #7eb8f7; color: #cfe0f7;
  border-radius: 6px; padding: 8px 16px; font-size: 13px;
}
#zoned-hint.visible { display: block; }
/* Tension halo: a red glow marking left-zone (contradicts/questions) nodes,
   kept separate from fill so the node still shows its type color. */
circle.tension-halo { filter: drop-shadow(0 0 5px #f77e7e) drop-shadow(0 0 3px #f77e7e); }
/* Hidden-edges badge: "+N" hint that a focused rim node has more direct
   connections than the depth-1 focus shows. */
text.hidden-badge { fill: #7eb8f7; font-size: 11px; font-weight: 700; paint-order: stroke; stroke: #0d1526; stroke-width: 3px; }

/* ── right column (note panel + chat panel) ── */
#right-col {
  width: 0; min-width: 0; display: flex; flex-direction: column;
  transition: width .2s ease; overflow: hidden;
  background: #13192e; border-left: 1px solid #2a3a5e;
}
#right-col.open { width: 360px; min-width: 360px; }

/* ── side panel ── */
#panel {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
}
#panel-header {
  padding: 14px 16px 10px; border-bottom: 1px solid #2a3a5e;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  flex-shrink: 0;
}
#panel-title { font-size: 14px; font-weight: 600; line-height: 1.4; flex: 1; }
#panel-type   { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
#panel-close  {
  background: none; border: none; color: #666; font-size: 16px;
  cursor: pointer; padding: 2px 4px; line-height: 1; flex-shrink: 0;
}
#panel-close:hover { color: #fff; }
#panel-tags { padding: 6px 16px 8px; font-size: 11px; color: #7eb8f7; border-bottom: 1px solid #2a3a5e; flex-shrink: 0; min-height: 28px; }
#panel-body {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 14px 16px; font-size: 13px; line-height: 1.7;
  white-space: pre-wrap; color: #bbb;
}
#panel-empty { color: #444; font-style: italic; }

/* ── graph elements ── */
/* The thin visible line ignores the pointer so the wide transparent .link-hit
   line beneath it receives hover (otherwise the 1px line would sit on top). */
.link { stroke-opacity: .5; fill: none; pointer-events: none; }
/* Hovered edge: thickened and full-opacity so it's clear which edge the tooltip
   is describing. */
.link.edge-hover { stroke-opacity: 1; stroke-width: 2.5px; }
.link.highlighted { stroke-opacity: 1; stroke-width: 2px; }
.node circle { stroke-width: 1.5px; cursor: pointer; transition: opacity .15s; }
.node.dimmed circle { opacity: .2; }
.node.dimmed text   { opacity: .15; }
.node text {
  font-size: 11px; pointer-events: none;
  fill: #ccc; paint-order: stroke;
  stroke: #1a1a2e; stroke-width: 3px; stroke-linejoin: round;
}
.node.highlighted text { fill: #fff; }
/* Dense-zone labels are hidden by default (shown on hover via #tooltip). */
.node text.dense-hidden { display: none; }
.node.search-dim circle { opacity: .12; }
.node.search-dim text   { opacity: .1; }

/* ── search bar ── */
#search-bar {
  position: absolute; top: 14px; right: 14px; z-index: 10;
  display: flex; gap: 6px; align-items: center;
}
#search-input {
  background: rgba(10,10,30,.9); border: 1px solid #3a4a6a;
  color: #e0e0e0; border-radius: 5px; padding: 5px 10px;
  font-size: 12px; width: 200px; outline: none;
}
#search-input:focus { border-color: #7eb8f7; }
/* Navigation breadcrumb chip — visually distinct from the toggle row (pill,
   accent border) so it does not read as another view toggle. */
#focus-crumb {
  /* Top-center banner (shares this slot with #zoned-hint, which only shows when
     unfocused) so it never collides with the corner legends. */
  display: none; position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
  z-index: 10;
  background: #1c2b4a; border: 1px solid #7eb8f7; color: #cfe0f7;
  border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#focus-crumb:hover { background: #26365a; color: #fff; }
#focus-crumb #focus-crumb-title { font-weight: 600; }
#focus-crumb #focus-crumb-hint { color: #8aa0c0; font-weight: 400; }
/* Reinforcement: while focused, the toggle row is disabled to signal you are in
   a navigated (drilled-in) state rather than just a different view. */
#btn-layout:disabled, #btn-zoned:disabled, #btn-status:disabled {
  opacity: 0.4; cursor: not-allowed;
}
#btn-layout {
  background: #16213e; border: 1px solid #3a4a6a;
  color: #ccc; border-radius: 5px; padding: 4px 10px;
  font-size: 12px; cursor: pointer;
}
#btn-layout:hover { background: #2a3a5e; color: #fff; }
#btn-layout.active { background: #2a3a5e; border-color: #7eb8f7; color: #7eb8f7; }
#btn-zoned {
  background: #16213e; border: 1px solid #3a4a6a;
  color: #ccc; border-radius: 5px; padding: 4px 10px;
  font-size: 12px; cursor: pointer;
}
#btn-zoned:hover { background: #2a3a5e; color: #fff; }
#btn-zoned.active { background: #2a3a5e; border-color: #7eb8f7; color: #7eb8f7; }

/* ── tray / export ── */
#tray-bar {
  position: absolute; bottom: 14px; right: 14px; z-index: 10;
  display: flex; gap: 6px; align-items: center;
}
#tray-count {
  background: rgba(10,10,30,.9); border: 1px solid #3a4a6a;
  color: #ccc; border-radius: 5px; padding: 4px 10px; font-size: 12px;
}
#btn-export {
  background: #16213e; border: 1px solid #3a4a6a; color: #ccc;
  border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer;
}
#btn-export:not([disabled]):hover { background: #2a3a5e; color: #fff; }
#btn-export[disabled] { opacity: .4; cursor: default; }

/* ── tray-selected node ring ── */
.node.tray-selected circle { stroke: #f0c040; stroke-width: 3px; }

/* ── context brief modal ── */
#brief-modal {
  background: #13192e; border: 1px solid #3a4a6a; border-radius: 8px;
  color: #e0e0e0; padding: 0; width: 520px; max-width: 95vw; max-height: 80vh;
  flex-direction: column; overflow: hidden;
}
#brief-modal[open] { display: flex; }
#brief-modal::backdrop { background: rgba(0,0,10,.75); }
#brief-modal-header {
  padding: 14px 16px 10px; border-bottom: 1px solid #2a3a5e;
  font-size: 14px; font-weight: 600; flex-shrink: 0;
}
#brief-note-list {
  flex: 1; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 12px;
}
.brief-note-row { border: 1px solid #2a3a5e; border-radius: 6px; padding: 10px 12px; background: #0e1228; }
.brief-note-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.brief-note-id { font-size: 10px; color: #666; margin-bottom: 6px; font-family: monospace; }
textarea.brief-ann {
  width: 100%; background: #1a1a2e; border: 1px solid #3a4a6a; color: #ccc;
  border-radius: 4px; padding: 5px 8px; font-size: 12px; resize: vertical;
  min-height: 36px; font-family: inherit;
}
.brief-body-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: #888; }
input.brief-body-toggle { accent-color: #7eb8f7; }
#brief-question-wrap { padding: 10px 16px; border-top: 1px solid #2a3a5e; flex-shrink: 0; }
#brief-question-label { font-size: 11px; color: #888; margin-bottom: 4px; }
#brief-question {
  width: 100%; background: #1a1a2e; border: 1px solid #3a4a6a; color: #ccc;
  border-radius: 4px; padding: 5px 8px; font-size: 12px; resize: vertical;
  min-height: 60px; font-family: inherit;
}
#brief-actions { padding: 10px 16px; border-top: 1px solid #2a3a5e; display: flex; gap: 8px; flex-shrink: 0; }
#btn-copy {
  background: #1e3a5e; border: 1px solid #3a6aaa; color: #7eb8f7;
  border-radius: 5px; padding: 6px 14px; font-size: 12px; cursor: pointer;
}
#btn-copy:hover { background: #2a4a7e; }
#btn-clear-tray {
  background: #16213e; border: 1px solid #3a4a6a; color: #888;
  border-radius: 5px; padding: 6px 14px; font-size: 12px; cursor: pointer;
}
#btn-clear-tray:hover { color: #ccc; }
#brief-fallback {
  display: none; width: 100%; background: #1a1a2e; border: 1px solid #f0a040;
  color: #ccc; border-radius: 4px; padding: 5px 8px; font-size: 11px;
  resize: vertical; min-height: 80px; margin-top: 6px; font-family: monospace;
}
</style>
</head>
<body>
<div id="graph-area">
  <div id="tooltip">
    <div class="tip-type"></div>
    <div class="tip-title"></div>
    <div class="tip-body"></div>
    <div class="tip-tags"></div>
  </div>
  <div id="legend"></div>
  <!-- Per-axis micro-legends, shown in focus mode at each screen edge next to the
       zone they describe. Replaces the single corner box. -->
  <div id="mlegend-top"    class="mlegend"><b>▲ answers to</b> governed by, refines, extends, grounded-by</div>
  <div id="mlegend-bottom" class="mlegend"><b>▼ builds on</b> governs, refines, supports</div>
  <div id="mlegend-left"   class="mlegend mlegend-warn"><b>◀ tension</b> contradicts, questions</div>
  <div id="mlegend-right"  class="mlegend"><b>▶ lateral</b> source-of, requires, related</div>
  <!-- Armed hint: shown when Zoned is on but no node is focused yet. Zones need
       a focus, so this tells the user to pick one. -->
  <div id="zoned-hint">Zoned view — click a node to focus and see its zones.</div>
  <div id="search-bar">
    <button id="btn-layout" title="Toggle grouped layout">Grouped</button>
    <button id="btn-zoned" title="Directional zoned ego layout (click a node first)">Zoned</button>
    <button id="btn-status" title="Filter by status">All</button>
    <input id="search-input" type="text" placeholder="Search notes…" autocomplete="off">
  </div>
  <!-- Navigation breadcrumb: shown only when drilled into a note's ego graph.
       It is deliberately NOT in the toggle row — drilling in is navigation, not
       a reversible view toggle, so it gets its own affordance. -->
  <button id="focus-crumb" title="Click to return to the full graph"><span id="focus-crumb-title"></span><span id="focus-crumb-hint"> — click a neighbor to recenter</span> ✕</button>
  <div id="tray-bar">
    <span id="tray-count">0 selected</span>
    <button id="btn-export" disabled>Review &amp; Export</button>
  </div>
  <dialog id="brief-modal">
    <div id="brief-modal-header">Context brief (<span id="brief-modal-count">0</span> notes)</div>
    <div id="brief-note-list"></div>
    <div id="brief-question-wrap">
      <div id="brief-question-label">Your question</div>
      <textarea id="brief-question">## Question
</textarea>
    </div>
    <div id="brief-actions">
      <button id="btn-copy">Copy to clipboard</button>
      <button id="btn-clear-tray">Clear selection</button>
      <textarea id="brief-fallback" readonly></textarea>
    </div>
  </dialog>
  <div id="zoom-controls">
    <button id="btn-zoom-in"  title="Zoom in">+</button>
    <button id="btn-zoom-out" title="Zoom out">−</button>
    <button id="btn-zoom-fit" title="Fit to view" style="font-size:12px">⊡</button>
  </div>
  <svg></svg>
</div>
<div id="right-col">
  <div id="panel">
    <div id="panel-header">
      <div>
        <div id="panel-title"></div>
        <div id="panel-type"></div>
      </div>
      <button id="panel-close" title="Close">✕</button>
    </div>
    <div id="panel-tags"></div>
    <div id="panel-body"></div>
  </div>
</div>
<script>
// ── D3 bundle ──────────────────────────────────────────────────────────────
{{.D3}}
// ── Graph data ─────────────────────────────────────────────────────────────
{{if .ServeMode}}
let graphState = null;
let egoID = null;

async function loadGraph(focusID) {
  const url = '/graph';
  const resp = await fetch(url);
  const data = await resp.json();
  if (!rootGraphData) rootGraphData = data;
  egoID = focusID || null;
  if (focusID) {
    // filter to ego subgraph client-side (same as static mode click)
    const egoNodes = new Set([focusID]);
    data.edges.forEach(edge => {
      const s = typeof edge.source==="object" ? edge.source.id : edge.source;
      const t = typeof edge.target==="object" ? edge.target.id : edge.target;
      if (s===focusID || t===focusID) { egoNodes.add(s); egoNodes.add(t); }
    });
    data.edges.forEach(edge => {
      const s = typeof edge.source==="object" ? edge.source.id : edge.source;
      const t = typeof edge.target==="object" ? edge.target.id : edge.target;
      if (egoNodes.has(s) || egoNodes.has(t)) { egoNodes.add(s); egoNodes.add(t); }
    });
    const egoData = {
      nodes: data.nodes.filter(n => egoNodes.has(n.id)),
      edges: data.edges.filter(edge => {
        const s = typeof edge.source==="object" ? edge.source.id : edge.source;
        const t = typeof edge.target==="object" ? edge.target.id : edge.target;
        return egoNodes.has(s) && egoNodes.has(t);
      })
    };
    rebuildSim(egoData);
    rebuildLegend(egoData);
  } else {
    rebuildSim(data);
    rebuildLegend(data);
  }
}

loadGraph(null);
{{else}}
const graph = {{.GraphJSON}};
{{end}}
// ── Type colours ──────────────────────────────────────────────────────────
const TYPE_COLOR = {
  concept:     "#7eb8f7",
  argument:    "#f7a87e",
  model:       "#7ef7b8",
  hypothesis:  "#c07ef7",
  observation: "#f7e07e",
  question:    "#f77eb8",
  protocol:    "#f77e7e",
};
const DEFAULT_COLOR = "#8899bb";
function nodeColor(d) { return TYPE_COLOR[d.type] || DEFAULT_COLOR; }

// Edge color by relationship family (the same families that drive zones):
//   tension (contradicts/questions) = red, matching the left-zone/halo;
//   provenance & tasks (source-of/requires) = amber; structural (governs/
//   refines/extends/grounded-by/supports) = blue. Unknown/untyped = gray.
const LINK_IDLE = "#3a4a6a";
function linkColor(type) {
  switch (type) {
    case "contradicts": case "questions": return "#f77e7e"; // tension
    case "source-of": case "requires":    return "#f7c66b"; // provenance / task
    case "governs": case "refines": case "extends":
    case "grounded-by": case "supports":  return "#7eb8f7"; // structural
    default: return LINK_IDLE;
  }
}

// ── SVG + zoom ─────────────────────────────────────────────────────────────
const svgEl  = document.querySelector("svg");
const width  = () => svgEl.clientWidth;
const height = () => svgEl.clientHeight;

const LABEL_ZOOM_THRESHOLD = 0.4;
const zoom = d3.zoom().scaleExtent([.05, 12]).on("zoom", e => {
  g.attr("transform", e.transform);
  const k = e.transform.k;
  // In a focused zoned view the layout is meaningless without labels, so keep
  // them shown regardless of zoom — EXCEPT dense-zone labels (.dense-hidden),
  // which stay hidden to avoid an unreadable pile. The armed (unfocused) zoned
  // state and force mode still hide labels below the threshold.
  g.selectAll(".node text").style("display", function() {
    if (this.classList.contains("dense-hidden")) return "none";
    return ((zonedMode && egoID) || k >= LABEL_ZOOM_THRESHOLD) ? null : "none";
  });
});
// Test helpers
window.__testSetZoom = (k) => { svg.call(zoom.transform, d3.zoomIdentity.scale(k)); };
window.__zoom = zoom;
const svg  = d3.select("svg").call(zoom);
// Arrowhead marker: shows each edge's source→target direction.
svg.append("defs").append("marker")
  .attr("id", "arrow").attr("viewBox", "0 -5 10 10")
  .attr("refX", 9).attr("refY", 0)
  .attr("markerWidth", 6).attr("markerHeight", 6)
  .attr("orient", "auto")
  .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#5a6a8a");
const g    = svg.append("g");
const gLinks = g.append("g");
const gNodes = g.append("g");

function zoomBy(k) { svg.transition().duration(200).call(zoom.scaleBy, k); }
function zoomFit() {
  const bounds = g.node().getBBox();
  if (!bounds.width || !bounds.height) return;
  const pad = 40;
  const W = width(), H = height();
  // Inset the fit region by every visible informational overlay so the graph is
  // fitted into the clear rectangle and never rendered underneath them.
  const svgRect = svgEl.getBoundingClientRect();
  let left = 0, right = W, top = 0, bottom = H;
  ["legend", "mlegend-top", "mlegend-bottom", "mlegend-left", "mlegend-right",
   "right-col", "focus-crumb", "search-bar", "zoned-hint"].forEach(id => {
    const el = document.getElementById(id);
    if (!el || getComputedStyle(el).display === "none") return;
    const r = el.getBoundingClientRect();
    // overlay position relative to the svg
    const oL = r.left - svgRect.left, oR = r.right - svgRect.left;
    const oT = r.top - svgRect.top,  oB = r.bottom - svgRect.top;
    // Reserve against an edge only when the overlay is short in the perpendicular
    // dimension — otherwise a full-height panel would (wrongly) reserve both top
    // AND bottom and collapse the clear region to a negative size.
    const narrow = (oR - oL) < W / 2;   // tall-and-narrow → a side overlay
    const short  = (oB - oT) < H / 2;   // wide-and-short → a top/bottom overlay
    // EDGE: how close to an edge counts as "hugging" it. Overlays sit inset by a
    // margin (~14-18px), so a flush (<=8) test misses them — use a looser band.
    const EDGE = 40;
    if (narrow && oL <= EDGE)      left   = Math.max(left, oR);   // hugs left edge
    if (narrow && oR >= W - EDGE)  right  = Math.min(right, oL);  // hugs right edge
    if (short  && oT <= EDGE)      top    = Math.max(top, oB);    // hugs top edge
    if (short  && oB >= H - EDGE)  bottom = Math.min(bottom, oT); // hugs bottom edge
  });
  const clearW = Math.max(50, right - left), clearH = Math.max(50, bottom - top);
  let s, tx, ty;
  if (zonedMode && egoID) {
    // Focused: keep the ego (graph origin 0,0) at the clear-region center so an
    // empty zone doesn't pull it off-center. Scale by the largest half-extent from
    // the origin in each axis so every populated zone still fits symmetrically.
    const halfW = Math.max(Math.abs(bounds.x), Math.abs(bounds.x + bounds.width)) || 1;
    const halfH = Math.max(Math.abs(bounds.y), Math.abs(bounds.y + bounds.height)) || 1;
    s = Math.min((clearW/2 - pad) / halfW, (clearH/2 - pad) / halfH, 2);
    tx = (left + clearW/2);   // origin.x (0) maps here
    ty = (top  + clearH/2);   // origin.y (0) maps here
  } else {
    s = Math.min((clearW - pad*2) / bounds.width, (clearH - pad*2) / bounds.height, 2);
    tx = (left + clearW/2) - s*(bounds.x + bounds.width/2);
    ty = (top  + clearH/2) - s*(bounds.y + bounds.height/2);
  }
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(s));
}
document.getElementById("btn-zoom-in").onclick  = () => zoomBy(1.4);
document.getElementById("btn-zoom-out").onclick = () => zoomBy(1/1.4);
document.getElementById("btn-zoom-fit").onclick = zoomFit;

// ── Panel ──────────────────────────────────────────────────────────────────
const rightCol   = document.getElementById("right-col");
const panel      = document.getElementById("panel");
const panelTitle = document.getElementById("panel-title");
const panelType  = document.getElementById("panel-type");
const panelTags  = document.getElementById("panel-tags");
const panelBody  = document.getElementById("panel-body");
document.getElementById("panel-close").addEventListener("click", closePanel);

function openPanel(d) {
  panelTitle.textContent = d.title;
  panelType.textContent  = d.type || "";
  panelType.style.color  = TYPE_COLOR[d.type] || DEFAULT_COLOR;
  panelTags.textContent  = (d.tags||[]).length ? d.tags.map(t=>"#"+t).join("  ") : "";
  if (d.body && d.body.trim()) {
    panelBody.textContent = d.body;
  } else {
    panelBody.innerHTML = '<span id="panel-empty">No body.</span>';
  }
  rightCol.classList.add("open");
}
function closePanel() {
  rightCol.classList.remove("open");
  clearHighlight(); selected = null;
}

// ── Legend ────────────────────────────────────────────────────────────────
const legendEl = document.getElementById("legend");
function rebuildLegend(data) {
  legendEl.innerHTML = "";
  const usedTypes = [...new Set(data.nodes.map(d => d.type))].sort();
  usedTypes.forEach(t => {
    const row = document.createElement("div"); row.className = "leg-row";
    row.innerHTML = `<div class="leg-dot" style="background:${TYPE_COLOR[t]||DEFAULT_COLOR}"></div><div class="leg-label">${t}</div>`;
    legendEl.appendChild(row);
  });
}

// ── Layout toggle ──────────────────────────────────────────────────────────
let groupingMode = false;
document.getElementById("btn-layout").addEventListener("click", () => {
  groupingMode = !groupingMode;
  document.getElementById("btn-layout").classList.toggle("active", groupingMode);
  if (groupingMode && zonedMode) { zonedMode = false; document.getElementById("btn-zoned").classList.remove("active"); }
  updateZonedHint(); // zonedMode may have flipped off — recompute the armed hint
  const d = currentGraphData || rootGraphData;
  if (d) { rebuildSim(d); rebuildLegend(d); }
});

// ── Zoned (directional ego) layout toggle ───────────────────────────────────
// Positions nodes by their server-computed `zone` (top/bottom/left/right)
// relative to the focused ego node. Zones come from `nn` (zoneOf) via the
// /graph?focus response, so the viewer and CLI share one mapping.
let zonedMode = false;
// The armed hint is visible exactly when zoned mode is on but nothing is
// focused yet — the one state where zones are undefined and we await a focus.
function updateZonedHint() {
  // Armed hint shows when zoned but unfocused; the per-axis micro-legends show
  // once a node is focused (they describe zones relative to that focus).
  document.getElementById("zoned-hint").classList.toggle("visible", zonedMode && !egoID);
  const focused = zonedMode && !!egoID;
  ["top", "bottom", "left", "right"].forEach(a =>
    document.getElementById("mlegend-" + a).classList.toggle("visible", focused));
}
// Remembers whether Grouped was active when Zoned was turned on, so exiting a
// focused zoned view can return the user to the view they came from.
let preFocusGrouping = false;
document.getElementById("btn-zoned").addEventListener("click", () => {
  zonedMode = !zonedMode;
  document.getElementById("btn-zoned").classList.toggle("active", zonedMode);
  if (zonedMode) preFocusGrouping = groupingMode; // snapshot before clearing below
  if (zonedMode && groupingMode) { groupingMode = false; document.getElementById("btn-layout").classList.remove("active"); }
  updateZonedHint();
  {{if .ServeMode}}
  // Adopt an existing selection: if a node was already clicked, entering Zoned
  // focuses it immediately instead of dropping to the armed "pick a node" state.
  if (zonedMode && selected) {
    const curGraph = currentGraphData || rootGraphData;
    const sel = curGraph && curGraph.nodes.find(n => n.id === selected);
    if (sel) { recenterZoned(sel.id, sel.title, sel); return; }
  }
  {{end}}
  const d = currentGraphData || rootGraphData;
  if (d) { rebuildSim(d); rebuildLegend(d); }
});

// Assign fixed x/y to each node by zone, centered on the ego (0,0).
// Nodes without a zone (ego itself, unmapped links) stay near center.
function applyZonedLayout(data) {
  // SPREAD: base radius of each zone from the ego. WEDGE: total angular spread of
  // same-zone nodes (kept < 90deg — half-wedge < 45deg — so the dominant axis
  // never flips and nodes stay inside their cardinal quadrant, preserving zone
  // classification). RING: extra radius per alternating
  // node so overlapping labels sit at different distances from the ego.
  const SPREAD = 240, WEDGE = (60 * Math.PI) / 180, RING = 130;
  const buckets = { top: [], bottom: [], left: [], right: [], none: [] };
  data.nodes.forEach(n => (buckets[n.zone] || buckets.none).push(n));
  // Arc-fan: distribute same-zone nodes across distinct angles within a wedge
  // centered on the zone's cardinal direction, so every edge leaves the ego at a
  // distinct angle instead of stacking on a straight perpendicular line. A lone
  // node sits exactly on the cardinal axis.
  const place = (arr, cardinal) => {
    const n = arr.length;
    arr.forEach((node, i) => {
      const frac = n > 1 ? i / (n - 1) - 0.5 : 0; // -0.5..0.5, 0 when lone
      const theta = cardinal + frac * WEDGE;
      const radius = SPREAD + (i % 2) * RING;
      node.x = radius * Math.cos(theta);
      node.y = radius * Math.sin(theta);
      node.fx = node.x; node.fy = node.y;
    });
  };
  place(buckets.top,    -Math.PI / 2);
  place(buckets.bottom,  Math.PI / 2);
  place(buckets.left,    Math.PI);
  place(buckets.right,   0);
  // The true ego sits at the exact origin (the recenter anchor). Any other
  // zoneless nodes are scattered on a ring around it so their labels stop
  // stacking on top of the ego's label. If no node matches egoID (e.g. the
  // full graph with no focus), the first none-node anchors the origin instead.
  const egoNode = buckets.none.find(n => n.id === egoID) || buckets.none[0];
  const others = buckets.none.filter(n => n !== egoNode);
  if (egoNode) { egoNode.x = 0; egoNode.y = 0; egoNode.fx = 0; egoNode.fy = 0; }
  // Zoneless neighbors (edge types with no zone mapping) go on their own OUTER
  // ring at DIAGONAL angles — offset from the four cardinals so they never sit on
  // a zone axis and collide with zoned nodes. Start at 45deg and step around.
  // Place them only in the four DIAGONAL bands (centered at 45/135/225/315deg),
  // fanning within a +/-30deg wedge of each so they never approach a cardinal.
  const DIAG = [Math.PI/4, 3*Math.PI/4, 5*Math.PI/4, 7*Math.PI/4];
  const DIAG_WEDGE = (40 * Math.PI) / 180;
  others.forEach((node, i) => {
    const band = DIAG[i % 4];
    const rank = Math.floor(i / 4);          // which node within this band
    const count = Math.ceil(others.length / 4);
    const frac = count > 1 ? (rank / (count - 1) - 0.5) : 0;
    const theta = band + frac * DIAG_WEDGE;
    const radius = SPREAD * 1.35 + (rank % 2) * 90; // outer "other" ring, staggered
    node.x = radius * Math.cos(theta);
    node.y = radius * Math.sin(theta);
    node.fx = node.x; node.fy = node.y;
  });
}

// Test helper: run the zoned layout on a synthetic dataset and return the
// computed positions so a browser guard can assert per-zone geometry
// (distinct edge angles, quadrant preservation) without server fixture data.
window.__testApplyZonedLayout = (nodes, testEgoID) => {
  const prevEgo = egoID;
  if (testEgoID !== undefined) egoID = testEgoID;
  try {
    const data = { nodes: nodes.map(n => ({ ...n })) };
    applyZonedLayout(data);
    return data.nodes.map(n => ({ id: n.id, zone: n.zone, x: n.x, y: n.y }));
  } finally {
    egoID = prevEgo;
  }
};

// Dense-zone label suppression: in a focused zoned view, a zone with more than
// DENSE_ZONE members would render an unreadable pile of always-on labels, so we
// hide those and reveal them on hover via the #tooltip. Sparse zones keep labels.
const DENSE_ZONE = 4;
function zoneCountsOf(nodes) {
  const c = {};
  nodes.forEach(n => { const z = n.zone || "none"; c[z] = (c[z] || 0) + 1; });
  return c;
}
function labelHidden(d, zoneCounts) {
  if (!(zonedMode && egoID)) return false;         // only when focused
  const z = d.zone || "none";
  return (zoneCounts[z] || 0) > DENSE_ZONE;
}
// Test hook: return {id: hidden-bool} for a synthetic dataset while focused.
window.__testLabelHidden = (nodes, testEgoID) => {
  const prevEgo = egoID, prevZoned = zonedMode;
  egoID = testEgoID; zonedMode = true;
  try {
    const counts = zoneCountsOf(nodes);
    const out = {};
    nodes.forEach(n => { out[n.id] = labelHidden(n, counts); });
    return out;
  } finally { egoID = prevEgo; zonedMode = prevZoned; }
};

// ── Simulation (rebuildable) ───────────────────────────────────────────────
let simulation = null;
let selected = null;

function rebuildSim(data) {
  currentGraphData = data;
  if (simulation) simulation.stop();
  selected = null;
  closePanel();

  // In a focused zoned view, color each edge by its relationship family and give
  // it a hover tooltip naming the link type; otherwise keep the neutral idle gray.
  const edgeStroke = d => (zonedMode && egoID) ? linkColor(d.type) : LINK_IDLE;
  // Transparent WIDE hit-line under each edge: a 1px visible line is nearly
  // impossible to hover, so this fat invisible line catches the pointer and
  // carries the link-type tooltip. Kept in sync with the visible line below.
  // Detect bidirectional pairs (A->B and B->A both present) so their edges can
  // bow to opposite sides instead of overlapping on the same straight line.
  const edgeId = e => `${typeof e.source==="object"?e.source.id:e.source}->${typeof e.target==="object"?e.target.id:e.target}`;
  const edgeSet = new Set(data.edges.map(edgeId));
  const isBidir = d => {
    const s = typeof d.source==="object"?d.source.id:d.source;
    const t = typeof d.target==="object"?d.target.id:d.target;
    return edgeSet.has(`${t}->${s}`);
  };
  const linkHit = gLinks.selectAll("path.link-hit")
    .data(data.edges, d => `${d.source}-${d.target}`)
    .join("path").attr("class", "link-hit").attr("fill", "none")
    .attr("stroke", "transparent").attr("stroke-width", 10);
  // Show the link type on hover via the shared #tooltip (native <title> is
  // unreliable — slow to appear and easy to miss on thin geometry).
  linkHit.on("mousemove", (e, d) => {
    if (!d.type) return;
    const tip = document.getElementById("tooltip");
    tip.style.display = "block";
    tip.style.left = (e.offsetX + 16) + "px";
    tip.style.top  = (e.offsetY - 10) + "px";
    tip.querySelector(".tip-type").textContent  = "edge";
    tip.querySelector(".tip-title").textContent = d.type;
    // Show the edge's annotation (its "why") beneath the type when present.
    tip.querySelector(".tip-body").textContent  = d.annotation || "";
    tip.querySelector(".tip-tags").textContent  = "";
    // Highlight the paired visible edge so it's clear which one the tip describes.
    link.classed("edge-hover", ld => ld.source === d.source && ld.target === d.target);
  }).on("mouseleave", () => {
    document.getElementById("tooltip").style.display = "none";
    link.classed("edge-hover", false);
  });
  const link = gLinks.selectAll("path.link")
    .data(data.edges, d => `${d.source}-${d.target}`)
    .join("path").attr("class", "link").attr("fill", "none").attr("stroke", edgeStroke)
    .attr("marker-end", "url(#arrow)");

  const node = gNodes.selectAll("g")
    .data(data.nodes, d => d.id)
    .join("g").attr("class", "node");

  // Build the edge path. The target endpoint is pulled back to the node boundary
  // so the arrowhead sits on the circle. A single edge is a straight line
  // (control point on the chord); a bidirectional pair bows to opposite sides via
  // a perpendicular control-point offset signed by direction.
  const ARROW_GAP = 6;
  const CURVE = 26;
  const linkPath = d => {
    const sx = d.source.x, sy = d.source.y;
    const dx = d.target.x - sx, dy = d.target.y - sy;
    const len = Math.hypot(dx, dy) || 1;
    const tx = d.target.x - (dx / len) * ((d.target.r || 6) + ARROW_GAP);
    const ty = d.target.y - (dy / len) * ((d.target.r || 6) + ARROW_GAP);
    if (!isBidir(d)) return `M${sx},${sy}L${tx},${ty}`; // straight for single edges
    // Curve each edge to the LEFT of its OWN travel direction (the left-hand
    // normal of source→target). Because the reverse edge travels the opposite
    // way, its left is the other world side — so the two arcs form parallel
    // non-crossing lanes rather than bowing to the same side and crossing.
    const mx = (sx + tx) / 2, my = (sy + ty) / 2;
    const px = -dy / len, py = dx / len; // unit left-hand normal of source→target
    const cx = mx + px * CURVE, cy = my + py * CURVE;
    return `M${sx},${sy}Q${cx},${cy} ${tx},${ty}`;
  };

  const degreeMap = {};
  data.edges.forEach(e => {
    const s = typeof e.source==="object" ? e.source.id : e.source;
    const t = typeof e.target==="object" ? e.target.id : e.target;
    degreeMap[s] = (degreeMap[s]||0) + 1;
    degreeMap[t] = (degreeMap[t]||0) + 1;
  });
  const maxDeg = Math.max(1, ...Object.values(degreeMap));
  const rScale = d3.scaleSqrt().domain([0, maxDeg]).range([5, 28]);
  data.nodes.forEach(n => { n.r = rScale(degreeMap[n.id]||0); });
  // Fill always encodes TYPE (matches the color legend). Left-zone (tension)
  // nodes get a separate red halo via the .tension-halo class rather than a red
  // fill — a red fill collides with the protocol type color and hides the type.
  node.selectAll("circle").data(d=>[d]).join("circle")
    .attr("r", d => d.r)
    .attr("fill", nodeColor).attr("stroke", nodeColor)
    .classed("tension-halo", d => zonedMode && d.zone === "left");
  // Dense-zone labels are hidden (revealed on hover) to avoid an unreadable pile.
  const zoneCounts = zoneCountsOf(data.nodes);
  node.selectAll("text").data(d=>[d]).join("text")
    .attr("dy", "1.5em").attr("text-anchor", "middle")
    .classed("dense-hidden", d => labelHidden(d, zoneCounts))
    .text(d => d.title.length > 28 ? d.title.slice(0,26)+"…" : d.title);
  // No native <title> on nodes: the JS #tooltip (which shows the full title and,
  // in zoned mode, a body preview) is the sole node tooltip — a native <title>
  // would pop up simultaneously and compete with it.
  node.selectAll("title").remove();
  // Hidden-edges badge: on a focused rim node, "+N" tells how many of its direct
  // connections are hidden by the depth-1 focus (total degree minus visible).
  // degreeMap is the visible (subgraph) degree; d.degree is the full-graph total.
  const hiddenCount = d => Math.max(0, (d.degree || 0) - (degreeMap[d.id] || 0));
  node.selectAll("text.hidden-badge").data(d => (egoID && d.id !== egoID && hiddenCount(d) > 0) ? [d] : [])
    .join("text")
    .attr("class", "hidden-badge")
    .attr("dx", d => (d.r || 6) + 2).attr("dy", d => -(d.r || 6))
    .attr("text-anchor", "start")
    .text(d => "+" + hiddenCount(d));

  // ── Tooltip ──────────────────────────────────────────────────────────────
  const tooltip = document.getElementById("tooltip");
  node.on("mousemove", (e,d) => {
    tooltip.style.display = "block";
    tooltip.style.left = (e.offsetX + 16) + "px";
    tooltip.style.top  = (e.offsetY - 10) + "px";
    tooltip.querySelector(".tip-type").textContent  = d.type || "";
    tooltip.querySelector(".tip-title").textContent = d.title;
    // In a focused zoned view, preview the note body so you can judge a neighbor
    // before clicking (which re-focuses and changes the graph).
    let body = "";
    if (zonedMode && egoID && d.body) {
      body = d.body.trim().replace(/\s+/g, " ");
      if (body.length > 200) body = body.slice(0, 200) + "…";
    }
    tooltip.querySelector(".tip-body").textContent = body;
    tooltip.querySelector(".tip-tags").textContent  = (d.tags||[]).length ? d.tags.map(t=>"#"+t).join("  ") : "";
  }).on("mouseleave", () => { tooltip.style.display = "none"; });

  // ── Highlight ─────────────────────────────────────────────────────────────
  function highlight(id) {
    const neighbors = new Set([id]);
    data.edges.forEach(e => {
      const s = typeof e.source==="object" ? e.source.id : e.source;
      const t = typeof e.target==="object" ? e.target.id : e.target;
      if (s===id) neighbors.add(t);
      if (t===id) neighbors.add(s);
    });
    node.classed("highlighted", d => neighbors.has(d.id))
        .classed("dimmed",      d => !neighbors.has(d.id));
    link.classed("highlighted", e => {
      const s = typeof e.source==="object" ? e.source.id : e.source;
      const t = typeof e.target==="object" ? e.target.id : e.target;
      return s===id || t===id;
    }).attr("stroke", e => {
      const s = typeof e.source==="object" ? e.source.id : e.source;
      const t = typeof e.target==="object" ? e.target.id : e.target;
      return (s===id || t===id) ? "#7eb8f7" : "#3a4a6a";
    });
  }

  // ── Click: ego-graph (client-side, both modes) ───────────────────────────
  node.on("click", (e,d) => {
    e.stopPropagation();
    // shift-click: toggle tray membership
    if (e.shiftKey) {
      if (tray.has(d.id)) { tray.delete(d.id); } else { tray.set(d.id, d); }
      node.classed("tray-selected", n => tray.has(n.id));
      updateTrayUI();
      return;
    }
    if (selected === d.id) { closePanel(); return; }
    selected = d.id;
    {{if .ServeMode}}
    fetch('/event', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: d.id, title: d.title})});
    if (zonedMode) {
      // Recenter to a server-computed ego subgraph carrying zones, then lay out
      // by zone. depth=1: only direct neighbors, which all carry a zone.
      recenterZoned(d.id, d.title, d);
      return;
    }
    {{end}}
    // dim nodes outside 2-hop neighborhood (keep full graph, just fade non-neighbors)
    const egoNodes = new Set([d.id]);
    data.edges.forEach(edge => {
      const s = typeof edge.source==="object" ? edge.source.id : edge.source;
      const t = typeof edge.target==="object" ? edge.target.id : edge.target;
      if (s===d.id || t===d.id) { egoNodes.add(s); egoNodes.add(t); }
    });
    data.edges.forEach(edge => {
      const s = typeof edge.source==="object" ? edge.source.id : edge.source;
      const t = typeof edge.target==="object" ? edge.target.id : edge.target;
      if (egoNodes.has(s) || egoNodes.has(t)) { egoNodes.add(s); egoNodes.add(t); }
    });
    gNodes.selectAll("g").classed("search-dim", n => !egoNodes.has(n.id));
    highlight(d.id);
    openPanel(d);
    // Pan left if node is under the panel (use rAF so panel layout is committed)
    requestAnimationFrame(() => {
      const panel = document.getElementById("right-col");
      const panelW = panel ? panel.offsetWidth : 0;
      const svgW = svg.node().clientWidth;
      const T = d3.zoomTransform(svg.node());
      const sx = T.applyX(d.x);
      const clearW = svgW - panelW;
      const pad = 40;
      if (panelW > 0 && sx > clearW - pad) {
        const shift = sx - (clearW - pad);
        svg.transition().duration(300).call(zoom.translateBy, -shift / T.k, 0);
      }
    });
  });
  svg.on("click", () => { closePanel(); });

  // ── Simulation ────────────────────────────────────────────────────────────
  const chargeStrength = Math.max(-800, -350 - data.nodes.length * 0.8);
  simulation = d3.forceSimulation(data.nodes)
    .force("link",      d3.forceLink(data.edges).id(d => d.id).distance(80))
    .force("charge",    d3.forceManyBody().strength(chargeStrength))
    .force("center",    d3.forceCenter(0, 0))
    .force("collision", d3.forceCollide(18));

  if (groupingMode) {
    // per-tick centroid force: attract each node toward its type's mean position
    simulation.force("group", () => {
      const centroids = {};
      data.nodes.forEach(n => {
        if (!centroids[n.type]) centroids[n.type] = {x: 0, y: 0, count: 0};
        centroids[n.type].x += n.x || 0;
        centroids[n.type].y += n.y || 0;
        centroids[n.type].count++;
      });
      Object.values(centroids).forEach(c => { c.x /= c.count; c.y /= c.count; });
      const alpha = simulation.alpha();
      data.nodes.forEach(n => {
        const c = centroids[n.type];
        if (!c) return;
        n.vx = (n.vx || 0) + (c.x - (n.x || 0)) * 0.08 * alpha;
        n.vy = (n.vy || 0) + (c.y - (n.y || 0)) * 0.08 * alpha;
      });
    });
  }

  // Both the visible edge and its hit-line follow the same computed path.
  simulation.on("tick", () => {
    link.attr("d", linkPath);
    linkHit.attr("d", linkPath);
    node.attr("transform", d=>`translate(${d.x},${d.y})`);
  });

  // Zones are defined only relative to a single focus, so the zoned layout is
  // meaningful only when a node is focused. Without a focus (egoID), fall through
  // to the force layout — arranging all zoneless nodes by "zone" would collapse
  // them into one meaningless ball.
  if (zonedMode && egoID) {
    // Directional zoned layout: fixed positions by zone, no force animation.
    // Glide nodes/links from their prior positions to the new zoned positions
    // so recentering keeps spatial continuity instead of teleporting.
    simulation.stop();
    applyZonedLayout(data);
    const T = 400;
    node.transition().duration(T).attr("transform", d => `translate(${d.x},${d.y})`);
    link.transition().duration(T).attr("d", linkPath);
    linkHit.transition().duration(T).attr("d", linkPath);
    // Fit AFTER the glide settles: zoomFit reads getBBox, which mid-transition
    // still reflects the old spread-out positions and yields a tiny (wrong)
    // scale. Wait for the transition to finish so it fits the final zoned layout.
    setTimeout(zoomFit, T + 20);
    return;
  }

  // Pre-tick to stable positions, fit viewport immediately, then let async ticks animate
  simulation.stop();
  for (let i = 0; i < 300; ++i) simulation.tick();
  node.attr("transform", d => `translate(${d.x},${d.y})`);
  link.attr("d", linkPath);
  linkHit.attr("d", linkPath);
  zoomFit();
  simulation.restart();
}

function clearHighlight() {
  gNodes.selectAll("g").classed("highlighted", false).classed("dimmed", false).classed("search-dim", false);
  // Restore each edge to its resting color: family color in a focused zoned view,
  // idle gray otherwise.
  gLinks.selectAll("path.link").classed("highlighted", false)
    .attr("stroke", d => (zonedMode && egoID) ? linkColor(d.type) : LINK_IDLE);
}

// ── Focus breadcrumb (drill-in navigation, both modes) ────────────────────
let rootGraphData = null;
let currentGraphData = null;
const TOGGLE_IDS = ["btn-layout", "btn-zoned", "btn-status"];
// Entering a focused (drilled-in) state: name the focus in the breadcrumb and
// disable the view toggles so the control set reflects that you have navigated.
function enterFocusedState(id, title) {
  egoID = id;
  const crumb = document.getElementById("focus-crumb");
  document.getElementById("focus-crumb-title").textContent = "Focused: " + title;
  crumb.style.display = "inline-block";
  TOGGLE_IDS.forEach(tid => { document.getElementById(tid).disabled = true; });
  updateZonedHint();
}
function exitFocusedState() {
  egoID = null;
  document.getElementById("focus-crumb").style.display = "none";
  TOGGLE_IDS.forEach(tid => { document.getElementById(tid).disabled = false; });
  updateZonedHint();
}
document.getElementById("focus-crumb").addEventListener("click", () => {
  exitFocusToFullGraph();
});
// Leave the focused view and render the full graph in the force layout. Clears
// the focus BEFORE rebuilding: rebuildSim reads egoID to decide whether to apply
// the zoned layout, and a stale egoID would zone the whole graph.
function exitFocusToFullGraph() {
  exitFocusedState();
  // Leave zoned mode and restore the layout the user came from (Grouped or force)
  // so exiting returns them where they were, not to a leftover zoned-armed state.
  zonedMode = false;
  document.getElementById("btn-zoned").classList.remove("active");
  groupingMode = preFocusGrouping;
  document.getElementById("btn-layout").classList.toggle("active", groupingMode);
  updateZonedHint();
  if (rootGraphData) {
    rebuildSim(rootGraphData);
    rebuildLegend(rootGraphData);
  }
}
{{if .ServeMode}}
// Recenter the zoned view on a node: fetch its depth-1 ego subgraph (carrying
// zones), enter the focused state, and lay it out by zone. Shared by node-click
// recentering and by adopting an existing selection when Zoned is toggled on.
function recenterZoned(id, title, panelNote) {
  fetch(`/graph?focus=${encodeURIComponent(id)}&depth=1`)
    .then(r => r.json())
    .then(ego => {
      enterFocusedState(id, title);
      rebuildSim(ego);      // rebuildSim calls closePanel(), so open the panel AFTER it
      rebuildLegend(ego);
      if (panelNote) openPanel(panelNote);
    });
}
{{end}}

// ── Zoom to fit a set of node IDs ────────────────────────────────────────────
function zoomToMatchedNodes(matchedIds) {
  if (!matchedIds || matchedIds.size === 0) return;
  const PAD = 60;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  gNodes.selectAll("g.node").each(function(d) {
    if (!matchedIds.has(d.id)) return;
    const r = Number(d3.select(this).select("circle").attr("r")) || 8;
    x0 = Math.min(x0, d.x - r);
    y0 = Math.min(y0, d.y - r);
    x1 = Math.max(x1, d.x + r);
    y1 = Math.max(y1, d.y + r);
  });
  if (!isFinite(x0)) return;
  const svgEl = svg.node();
  const W = svgEl.clientWidth || svgEl.getBoundingClientRect().width;
  const H = svgEl.clientHeight || svgEl.getBoundingClientRect().height;
  const bw = x1 - x0, bh = y1 - y0;
  const scale = Math.min((W - 2 * PAD) / Math.max(bw, 1), (H - 2 * PAD) / Math.max(bh, 1), 4);
  const tx = (W / 2) - scale * ((x0 + x1) / 2);
  const ty = (H / 2) - scale * ((y0 + y1) / 2);
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

// ── Search with debounce (serve mode only) ─────────────────────────────────
{{if .ServeMode}}
let debounceTimer = null;
document.getElementById("search-input").addEventListener("input", e => {
  clearTimeout(debounceTimer);
  const q = e.target.value.trim();
  debounceTimer = setTimeout(async () => {
    if (!q) {
      gNodes.selectAll("g").classed("search-dim", false);
      return;
    }
    // Search spans the whole notebook, but a focused zoned view only renders the
    // ego subgraph — so exit the focus back to the full graph first, otherwise
    // matches outside the focus would be unreachable.
    if (zonedMode && egoID) exitFocusToFullGraph();
    // clear click-highlight state when search takes over
    clearHighlight();
    const resp = await fetch('/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query: q})
    });
    const results = await resp.json();
    const scoreMap = {};
    results.forEach(r => { scoreMap[r.id] = r.score; });
    gNodes.selectAll("g").classed("search-dim", d => !scoreMap[d.id]);
    const matchedIds = new Set(Object.keys(scoreMap));
    zoomToMatchedNodes(matchedIds);
  }, 300);
});
{{end}}

// ── Status overlay toggle ─────────────────────────────────────────────────
const STATUS_CYCLE = ["All", "Draft", "Reviewed", "Permanent"];
let statusIdx = 0;
document.getElementById("btn-status").addEventListener("click", () => {
  statusIdx = (statusIdx + 1) % STATUS_CYCLE.length;
  const sel = STATUS_CYCLE[statusIdx];
  document.getElementById("btn-status").textContent = sel;
  if (sel === "All") {
    gNodes.selectAll("g").classed("search-dim", false);
  } else {
    gNodes.selectAll("g").classed("search-dim", d => (d.status||"draft").toLowerCase() !== sel.toLowerCase());
  }
});

// ── Selection tray + modal ────────────────────────────────────────────────
const tray = new Map(); // id → node data

function updateTrayUI() {
  const count = tray.size;
  const btn = document.getElementById("btn-export");
  if (count === 0) {
    document.getElementById("tray-count").textContent = "0 selected";
    btn.setAttribute("disabled", "");
  } else {
    const titles = [...tray.values()].map(d => d.title);
    let label;
    if (titles.length === 1) label = titles[0];
    else if (titles.length === 2) label = titles[0] + ", " + titles[1];
    else label = titles[0] + ", " + titles[1] + " +" + (titles.length - 2);
    document.getElementById("tray-count").textContent = label;
    btn.removeAttribute("disabled");
  }
}

// ── Brief modal ───────────────────────────────────────────────────────────
const briefModal = document.getElementById("brief-modal");

function buildExportText() {
  const lines = ["## Context brief\n"];
  const noteList = document.getElementById("brief-note-list");
  const rows = noteList.querySelectorAll(".brief-note-row");
  rows.forEach(row => {
    const title = row.querySelector(".brief-note-title").textContent;
    const id    = row.querySelector(".brief-note-id").textContent;
    const ann   = row.querySelector("textarea.brief-ann").value.trim();
    const includeBody = row.querySelector("input.brief-body-toggle").checked;
    lines.push(`### ${title} (${id})`);
    if (ann) lines.push(ann);
    if (includeBody) {
      const d = tray.get(id);
      if (d && d.body && d.body.trim()) lines.push("\n" + d.body.trim());
    }
    lines.push("");
  });
  lines.push(document.getElementById("brief-question").value);
  return lines.join("\n");
}

function openBriefModal() {
  const noteList = document.getElementById("brief-note-list");
  noteList.innerHTML = "";
  document.getElementById("brief-modal-count").textContent = String(tray.size);
  document.getElementById("brief-fallback").style.display = "none";
  tray.forEach((d, id) => {
    const row = document.createElement("div");
    row.className = "brief-note-row";
    row.innerHTML = `
      <div class="brief-note-title">${d.title}</div>
      <div class="brief-note-id">${id}</div>
      <textarea class="brief-ann" placeholder="Why this note matters…" rows="2"></textarea>
      <div class="brief-body-row">
        <input type="checkbox" class="brief-body-toggle" id="body-${id}">
        <label for="body-${id}">Include body</label>
      </div>`;
    noteList.appendChild(row);
  });
  briefModal.showModal();
}

document.getElementById("btn-export").addEventListener("click", () => {
  if (tray.size === 0) return;
  openBriefModal();
});

document.getElementById("btn-copy").addEventListener("click", async () => {
  const text = buildExportText();
  const fallback = document.getElementById("brief-fallback");
  try {
    await navigator.clipboard.writeText(text);
    fallback.style.display = "none";
  } catch {
    fallback.style.display = "block";
    fallback.value = text;
    fallback.select();
  }
});

document.getElementById("btn-clear-tray").addEventListener("click", () => {
  tray.clear();
  updateTrayUI();
  gNodes.selectAll("g").classed("tray-selected", false);
  briefModal.close();
});

// Close on backdrop click (click on dialog element itself, not its children)
briefModal.addEventListener("click", e => {
  if (e.target === briefModal) briefModal.close();
});

// ── Initial render ────────────────────────────────────────────────────────
{{if .ServeMode}}
// serve: loadGraph() called above fetches data then calls renderGraph
{{else}}
rootGraphData = graph;
rebuildSim(graph);
rebuildLegend(graph);
{{end}}
</script>
