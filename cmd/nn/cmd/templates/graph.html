<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>nn graph</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; display: flex; }

/* ── graph area ── */
#graph-area { flex: 1; position: relative; min-width: 0; }
svg { width: 100%; height: 100%; display: block; cursor: grab; }
svg:active { cursor: grabbing; }

/* ── tooltip ── */
#tooltip {
  position: absolute; pointer-events: none; z-index: 20;
  background: rgba(10,10,30,.92); border: 1px solid #3a4a6a;
  padding: 8px 12px; border-radius: 6px; font-size: 13px;
  max-width: 280px; line-height: 1.4; display: none;
}
#tooltip .tip-title { font-weight: 600; margin-bottom: 3px; }
#tooltip .tip-tags  { color: #7eb8f7; font-size: 11px; }
#tooltip .tip-type  { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }

/* ── zoom controls ── */
#zoom-controls {
  position: absolute; bottom: 18px; left: 18px; z-index: 10;
  display: flex; flex-direction: column; gap: 4px;
}
#zoom-controls button {
  width: 30px; height: 30px; background: #16213e; border: 1px solid #3a4a6a;
  color: #ccc; font-size: 16px; border-radius: 5px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; line-height: 1;
}
#zoom-controls button:hover { background: #2a3a5e; color: #fff; }

/* ── node type legend ── */
#legend {
  position: absolute; top: 14px; left: 14px; z-index: 10;
  background: rgba(10,10,30,.85); border: 1px solid #2a3a5e;
  border-radius: 6px; padding: 8px 12px; font-size: 11px;
}
#legend .leg-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
#legend .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#legend .leg-label { color: #aaa; }

/* ── side panel ── */
#panel {
  width: 360px; min-width: 360px;
  background: #13192e; border-left: 1px solid #2a3a5e;
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .2s ease;
  position: absolute; right: 0; top: 0; bottom: 0; z-index: 15;
}
#panel.open { transform: translateX(0); position: relative; }
#panel-header {
  padding: 14px 16px 10px; border-bottom: 1px solid #2a3a5e;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  flex-shrink: 0;
}
#panel-title { font-size: 14px; font-weight: 600; line-height: 1.4; flex: 1; }
#panel-type   { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
#panel-close  {
  background: none; border: none; color: #666; font-size: 16px;
  cursor: pointer; padding: 2px 4px; line-height: 1; flex-shrink: 0;
}
#panel-close:hover { color: #fff; }
#panel-tags { padding: 6px 16px 8px; font-size: 11px; color: #7eb8f7; border-bottom: 1px solid #2a3a5e; flex-shrink: 0; min-height: 28px; }
#panel-body {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 14px 16px; font-size: 13px; line-height: 1.7;
  white-space: pre-wrap; color: #bbb;
}
#panel-empty { color: #444; font-style: italic; }

/* ── graph elements ── */
.link { stroke-opacity: .5; fill: none; }
.link.highlighted { stroke-opacity: 1; stroke-width: 2px; }
.node circle { stroke-width: 1.5px; cursor: pointer; transition: opacity .15s; }
.node.dimmed circle { opacity: .2; }
.node.dimmed text   { opacity: .15; }
.node text {
  font-size: 11px; pointer-events: none;
  fill: #ccc; paint-order: stroke;
  stroke: #1a1a2e; stroke-width: 3px; stroke-linejoin: round;
}
.node.highlighted text { fill: #fff; }
.node.search-dim circle { opacity: .12; }
.node.search-dim text   { opacity: .1; }

/* ── search bar ── */
#search-bar {
  position: absolute; top: 14px; right: 14px; z-index: 10;
  display: flex; gap: 6px; align-items: center;
}
#search-input {
  background: rgba(10,10,30,.9); border: 1px solid #3a4a6a;
  color: #e0e0e0; border-radius: 5px; padding: 5px 10px;
  font-size: 12px; width: 200px; outline: none;
}
#search-input:focus { border-color: #7eb8f7; }
#btn-back {
  display: none; background: #16213e; border: 1px solid #3a4a6a;
  color: #ccc; border-radius: 5px; padding: 4px 10px;
  font-size: 12px; cursor: pointer;
}
#btn-back:hover { background: #2a3a5e; color: #fff; }
#btn-layout {
  background: #16213e; border: 1px solid #3a4a6a;
  color: #ccc; border-radius: 5px; padding: 4px 10px;
  font-size: 12px; cursor: pointer;
}
#btn-layout:hover { background: #2a3a5e; color: #fff; }
#btn-layout.active { background: #2a3a5e; border-color: #7eb8f7; color: #7eb8f7; }

/* ── message panel (serve mode) ── */
#msg-panel {
  position: absolute; bottom: 18px; right: 18px; z-index: 20;
  width: 320px; max-height: 260px; overflow-y: auto;
  background: rgba(10,10,30,.93); border: 1px solid #3a4a6a;
  border-radius: 8px; padding: 10px 12px;
  display: none; flex-direction: column; gap: 8px;
}
#msg-panel.visible { display: flex; }
.msg-bubble {
  background: #1e2a4a; border-radius: 6px; padding: 7px 10px;
  font-size: 12px; line-height: 1.5; color: #dde; word-break: break-word;
}
.msg-bubble .msg-ts { font-size: 10px; color: #556; margin-top: 4px; }
</style>
</head>
<body>
<div id="graph-area">
  <div id="tooltip">
    <div class="tip-type"></div>
    <div class="tip-title"></div>
    <div class="tip-tags"></div>
  </div>
  <div id="legend"></div>
  <div id="search-bar">
    <button id="btn-back">← Back</button>
    <button id="btn-layout" title="Toggle grouped layout">Grouped</button>
    <input id="search-input" type="text" placeholder="Search notes…" autocomplete="off">
  </div>
  <div id="zoom-controls">
    <button id="btn-zoom-in"  title="Zoom in">+</button>
    <button id="btn-zoom-out" title="Zoom out">−</button>
    <button id="btn-zoom-fit" title="Fit to view" style="font-size:12px">⊡</button>
  </div>
  <svg></svg>
</div>
<div id="msg-panel"></div>
<div id="panel">
  <div id="panel-header">
    <div>
      <div id="panel-title"></div>
      <div id="panel-type"></div>
    </div>
    <button id="panel-close" title="Close">✕</button>
  </div>
  <div id="panel-tags"></div>
  <div id="panel-body"></div>
</div>
<script>
// ── D3 bundle ──────────────────────────────────────────────────────────────
{{.D3}}
// ── Graph data ─────────────────────────────────────────────────────────────
{{if .ServeMode}}
let graphState = null;
let egoID = null;

async function loadGraph(focusID) {
  const url = '/graph';
  const resp = await fetch(url);
  const data = await resp.json();
  if (!rootGraphData) rootGraphData = data;
  egoID = focusID || null;
  if (focusID) {
    // filter to ego subgraph client-side (same as static mode click)
    const egoNodes = new Set([focusID]);
    data.edges.forEach(edge => {
      const s = typeof edge.source==="object" ? edge.source.id : edge.source;
      const t = typeof edge.target==="object" ? edge.target.id : edge.target;
      if (s===focusID || t===focusID) { egoNodes.add(s); egoNodes.add(t); }
    });
    data.edges.forEach(edge => {
      const s = typeof edge.source==="object" ? edge.source.id : edge.source;
      const t = typeof edge.target==="object" ? edge.target.id : edge.target;
      if (egoNodes.has(s) || egoNodes.has(t)) { egoNodes.add(s); egoNodes.add(t); }
    });
    const egoData = {
      nodes: data.nodes.filter(n => egoNodes.has(n.id)),
      edges: data.edges.filter(edge => {
        const s = typeof edge.source==="object" ? edge.source.id : edge.source;
        const t = typeof edge.target==="object" ? edge.target.id : edge.target;
        return egoNodes.has(s) && egoNodes.has(t);
      })
    };
    rebuildSim(egoData);
    rebuildLegend(egoData);
  } else {
    rebuildSim(data);
    rebuildLegend(data);
  }
}

loadGraph(null);
{{else}}
const graph = {{.GraphJSON}};
{{end}}
// ── Type colours ──────────────────────────────────────────────────────────
const TYPE_COLOR = {
  concept:     "#7eb8f7",
  argument:    "#f7a87e",
  model:       "#7ef7b8",
  hypothesis:  "#c07ef7",
  observation: "#f7e07e",
  question:    "#f77eb8",
  protocol:    "#f77e7e",
};
const DEFAULT_COLOR = "#8899bb";
function nodeColor(d) { return TYPE_COLOR[d.type] || DEFAULT_COLOR; }

// ── SVG + zoom ─────────────────────────────────────────────────────────────
const svgEl  = document.querySelector("svg");
const width  = () => svgEl.clientWidth;
const height = () => svgEl.clientHeight;

const zoom = d3.zoom().scaleExtent([.05, 12]).on("zoom", e => g.attr("transform", e.transform));
const svg  = d3.select("svg").call(zoom);
const g    = svg.append("g");
const gLinks = g.append("g");
const gNodes = g.append("g");

function zoomBy(k) { svg.transition().duration(200).call(zoom.scaleBy, k); }
function zoomFit() {
  const bounds = g.node().getBBox();
  if (!bounds.width || !bounds.height) return;
  const pad = 40;
  const s = Math.min((width() - pad*2) / bounds.width, (height() - pad*2) / bounds.height, 2);
  const tx = width()/2  - s*(bounds.x + bounds.width/2);
  const ty = height()/2 - s*(bounds.y + bounds.height/2);
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(s));
}
document.getElementById("btn-zoom-in").onclick  = () => zoomBy(1.4);
document.getElementById("btn-zoom-out").onclick = () => zoomBy(1/1.4);
document.getElementById("btn-zoom-fit").onclick = zoomFit;

// ── Panel ──────────────────────────────────────────────────────────────────
const panel      = document.getElementById("panel");
const panelTitle = document.getElementById("panel-title");
const panelType  = document.getElementById("panel-type");
const panelTags  = document.getElementById("panel-tags");
const panelBody  = document.getElementById("panel-body");
document.getElementById("panel-close").addEventListener("click", closePanel);

function openPanel(d) {
  panelTitle.textContent = d.title;
  panelType.textContent  = d.type || "";
  panelType.style.color  = TYPE_COLOR[d.type] || DEFAULT_COLOR;
  panelTags.textContent  = (d.tags||[]).length ? d.tags.map(t=>"#"+t).join("  ") : "";
  if (d.body && d.body.trim()) {
    panelBody.textContent = d.body;
  } else {
    panelBody.innerHTML = '<span id="panel-empty">No body.</span>';
  }
  panel.classList.add("open");
}
function closePanel() {
  panel.classList.remove("open");
  clearHighlight(); selected = null;
}

// ── Legend ────────────────────────────────────────────────────────────────
const legendEl = document.getElementById("legend");
function rebuildLegend(data) {
  legendEl.innerHTML = "";
  const usedTypes = [...new Set(data.nodes.map(d => d.type))].sort();
  usedTypes.forEach(t => {
    const row = document.createElement("div"); row.className = "leg-row";
    row.innerHTML = `<div class="leg-dot" style="background:${TYPE_COLOR[t]||DEFAULT_COLOR}"></div><div class="leg-label">${t}</div>`;
    legendEl.appendChild(row);
  });
}

// ── Layout toggle ──────────────────────────────────────────────────────────
let groupingMode = false;
document.getElementById("btn-layout").addEventListener("click", () => {
  groupingMode = !groupingMode;
  document.getElementById("btn-layout").classList.toggle("active", groupingMode);
  const d = currentGraphData || rootGraphData;
  if (d) { rebuildSim(d); rebuildLegend(d); }
});

// ── Simulation (rebuildable) ───────────────────────────────────────────────
let simulation = null;
let selected = null;

function rebuildSim(data) {
  currentGraphData = data;
  if (simulation) simulation.stop();
  selected = null;
  closePanel();

  const link = gLinks.selectAll("line")
    .data(data.edges, d => `${d.source}-${d.target}`)
    .join("line").attr("class", "link").attr("stroke", "#3a4a6a");

  const node = gNodes.selectAll("g")
    .data(data.nodes, d => d.id)
    .join("g").attr("class", "node")
    .call(d3.drag()
      .on("start", (e,d) => { if (!e.active) simulation.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag",  (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on("end",   (e,d) => { if (!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }));

  node.selectAll("circle").data(d=>[d]).join("circle")
    .attr("r", 10).attr("fill", nodeColor).attr("stroke", d => nodeColor(d));
  node.selectAll("text").data(d=>[d]).join("text")
    .attr("dy", "1.5em").attr("text-anchor", "middle")
    .text(d => d.title.length > 28 ? d.title.slice(0,26)+"…" : d.title);

  // ── Tooltip ──────────────────────────────────────────────────────────────
  const tooltip = document.getElementById("tooltip");
  node.on("mousemove", (e,d) => {
    tooltip.style.display = "block";
    tooltip.style.left = (e.offsetX + 16) + "px";
    tooltip.style.top  = (e.offsetY - 10) + "px";
    tooltip.querySelector(".tip-type").textContent  = d.type || "";
    tooltip.querySelector(".tip-title").textContent = d.title;
    tooltip.querySelector(".tip-tags").textContent  = (d.tags||[]).length ? d.tags.map(t=>"#"+t).join("  ") : "";
  }).on("mouseleave", () => { tooltip.style.display = "none"; });

  // ── Highlight ─────────────────────────────────────────────────────────────
  function highlight(id) {
    const neighbors = new Set([id]);
    data.edges.forEach(e => {
      const s = typeof e.source==="object" ? e.source.id : e.source;
      const t = typeof e.target==="object" ? e.target.id : e.target;
      if (s===id) neighbors.add(t);
      if (t===id) neighbors.add(s);
    });
    node.classed("highlighted", d => neighbors.has(d.id))
        .classed("dimmed",      d => !neighbors.has(d.id));
    link.classed("highlighted", e => {
      const s = typeof e.source==="object" ? e.source.id : e.source;
      const t = typeof e.target==="object" ? e.target.id : e.target;
      return s===id || t===id;
    }).attr("stroke", e => {
      const s = typeof e.source==="object" ? e.source.id : e.source;
      const t = typeof e.target==="object" ? e.target.id : e.target;
      return (s===id || t===id) ? "#7eb8f7" : "#3a4a6a";
    });
  }

  // ── Click: ego-graph (client-side, both modes) ───────────────────────────
  node.on("click", (e,d) => {
    e.stopPropagation();
    if (selected === d.id) { closePanel(); return; }
    selected = d.id;
    highlight(d.id);
    openPanel(d);
    {{if .ServeMode}}
    fetch('/event', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: d.id, title: d.title})});
    {{end}}
    // show ego subgraph: filter to 2-hop neighbors in memory
    const egoNodes = new Set([d.id]);
    data.edges.forEach(edge => {
      const s = typeof edge.source==="object" ? edge.source.id : edge.source;
      const t = typeof edge.target==="object" ? edge.target.id : edge.target;
      if (s===d.id || t===d.id) { egoNodes.add(s); egoNodes.add(t); }
    });
    // second hop
    data.edges.forEach(edge => {
      const s = typeof edge.source==="object" ? edge.source.id : edge.source;
      const t = typeof edge.target==="object" ? edge.target.id : edge.target;
      if (egoNodes.has(s) || egoNodes.has(t)) { egoNodes.add(s); egoNodes.add(t); }
    });
    const egoData = {
      nodes: data.nodes.filter(n => egoNodes.has(n.id)),
      edges: data.edges.filter(edge => {
        const s = typeof edge.source==="object" ? edge.source.id : edge.source;
        const t = typeof edge.target==="object" ? edge.target.id : edge.target;
        return egoNodes.has(s) && egoNodes.has(t);
      })
    };
    rebuildSim(egoData);
    rebuildLegend(egoData);
    document.getElementById("btn-back").style.display = "inline-block";
  });
  svg.on("click", () => { closePanel(); });

  // ── Simulation ────────────────────────────────────────────────────────────
  simulation = d3.forceSimulation(data.nodes)
    .force("link",      d3.forceLink(data.edges).id(d => d.id).distance(140))
    .force("charge",    d3.forceManyBody().strength(-350))
    .force("center",    d3.forceCenter(0, 0))
    .force("collision", d3.forceCollide(36));

  if (groupingMode) {
    // per-tick centroid force: attract each node toward its type's mean position
    simulation.force("group", () => {
      const centroids = {};
      data.nodes.forEach(n => {
        if (!centroids[n.type]) centroids[n.type] = {x: 0, y: 0, count: 0};
        centroids[n.type].x += n.x || 0;
        centroids[n.type].y += n.y || 0;
        centroids[n.type].count++;
      });
      Object.values(centroids).forEach(c => { c.x /= c.count; c.y /= c.count; });
      const alpha = simulation.alpha();
      data.nodes.forEach(n => {
        const c = centroids[n.type];
        if (!c) return;
        n.vx = (n.vx || 0) + (c.x - (n.x || 0)) * 0.08 * alpha;
        n.vy = (n.vy || 0) + (c.y - (n.y || 0)) * 0.08 * alpha;
      });
    });
  }

  simulation.on("tick", () => {
    link.attr("x1", d=>d.source.x).attr("y1", d=>d.source.y)
        .attr("x2", d=>d.target.x).attr("y2", d=>d.target.y);
    node.attr("transform", d=>`translate(${d.x},${d.y})`);
  });
  simulation.on("end", zoomFit);
}

function clearHighlight() {
  gNodes.selectAll("g").classed("highlighted", false).classed("dimmed", false);
  gLinks.selectAll("line").classed("highlighted", false).attr("stroke", "#3a4a6a");
}

// ── Back button (both modes) ──────────────────────────────────────────────
let rootGraphData = null;
let currentGraphData = null;
document.getElementById("btn-back").addEventListener("click", () => {
  if (rootGraphData) {
    rebuildSim(rootGraphData);
    rebuildLegend(rootGraphData);
  }
  document.getElementById("btn-back").style.display = "none";
});

// ── Search with debounce (serve mode only) ─────────────────────────────────
{{if .ServeMode}}
let debounceTimer = null;
document.getElementById("search-input").addEventListener("input", e => {
  clearTimeout(debounceTimer);
  const q = e.target.value.trim();
  debounceTimer = setTimeout(async () => {
    if (!q) {
      gNodes.selectAll("g").classed("search-dim", false);
      return;
    }
    const resp = await fetch('/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query: q})
    });
    const results = await resp.json();
    const scoreMap = {};
    results.forEach(r => { scoreMap[r.id] = r.score; });
    gNodes.selectAll("g").classed("search-dim", d => !scoreMap[d.id]);
  }, 300);
});
{{end}}

// ── Message panel polling (serve mode only) ───────────────────────────────
{{if .ServeMode}}
const msgPanel = document.getElementById("msg-panel");
async function pollMessages() {
  try {
    const resp = await fetch('/messages');
    const msgs = await resp.json();
    if (msgs && msgs.length) {
      msgPanel.classList.add("visible");
      msgs.forEach(m => {
        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        bubble.innerHTML = `<div>${m.text.replace(/</g,"&lt;")}</div><div class="msg-ts">${m.ts}</div>`;
        msgPanel.appendChild(bubble);
        msgPanel.scrollTop = msgPanel.scrollHeight;
      });
    }
  } catch(_) {}
}
setInterval(pollMessages, 2000);
{{end}}

// ── Initial render ────────────────────────────────────────────────────────
{{if .ServeMode}}
// serve: loadGraph() called above fetches data then calls renderGraph
{{else}}
rootGraphData = graph;
rebuildSim(graph);
rebuildLegend(graph);
{{end}}
</script>
</body>
</html>
